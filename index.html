<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUSINESS INTELLIGENCE OS</title>
<style>
:root{--bg:#07090d;--panel:#0f141c;--line:#28313e;--text:#f4f7f9;--muted:#98a5b5;--lime:#d9ff4d;--good:#91e6b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:700px;margin:auto;padding:20px 17px 100px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:11px;font-weight:900;letter-spacing:.15em}.clock{font-size:11px;color:var(--muted)}h1{font-size:32px;line-height:1.12;margin:22px 0 7px}.lead{color:var(--muted);line-height:1.65;font-size:14px}.tabs{display:flex;gap:7px;overflow:auto;margin:22px 0 16px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:11px;cursor:pointer}.tab.on{background:var(--lime);color:#090b0e;border-color:var(--lime);font-weight:900}.toolbar{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}.btn,.archiveSelect{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:11px;font-size:11px}.btn{cursor:pointer}.btn.active{border-color:var(--good);color:var(--good)}.archiveBar{display:flex;gap:8px;align-items:center;margin:0 0 18px}.archiveSelect{min-width:150px}.archiveLabel{font-size:10px;color:var(--muted)}.panel{display:none}.panel.on{display:block}.marketIntro{background:#10170f;border:1px solid #293b25;border-radius:17px;padding:17px;margin-bottom:15px}.marketIntro b{color:var(--lime)}.small{font-size:11px;color:var(--muted);line-height:1.6}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:18px;margin:12px 0}.rank{font-size:10px;color:var(--lime);font-weight:900;letter-spacing:.1em}.card h2{font-size:19px;line-height:1.45;margin:8px 0 10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:9px;padding:5px 7px;background:#19212c;border-radius:7px;color:#c8d1dc}.sec{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}.sec b{font-size:9px;letter-spacing:.1em;color:#b7c2ce}.sec p{font-size:14px;line-height:1.7;margin:5px 0}.src{display:inline-block;margin-top:8px;color:var(--text);font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.score{font-weight:900;color:var(--lime)}.empty{padding:28px 8px;color:var(--muted);line-height:1.7}.footer{color:var(--muted);font-size:10px;line-height:1.6;margin-top:22px}
</style></head><body><main class="app">
<div class="top"><div class="brand">BUSINESS INTELLIGENCE OS</div><div class="clock" id="date"></div></div><h1>市場を読む。<br>事業に変える。</h1><p class="lead">HR / AI / 政策 / MARKETを、FACTと解釈を混ぜずに読む。過去の記事も日付から遡って保存できます。</p>
<div class="tabs"><div class="tab on" data-tab="today">TODAY</div><div class="tab" data-tab="hr">HR</div><div class="tab" data-tab="ai">AI</div><div class="tab" data-tab="policy">政策</div><div class="tab" data-tab="market">MARKET</div></div>
<div class="toolbar"><button class="btn" id="mustBtn">🔥 MUST READのみ</button><button class="btn" id="savedBtn">☆ 保存のみ</button></div>
<div class="archiveBar"><span class="archiveLabel">記事の日付</span><select id="archiveSelect" class="archiveSelect"><option value="current">最新</option></select><button class="btn" id="todayBtn">最新に戻る</button></div>
<div id="today" class="panel on"></div><div id="hr" class="panel"></div><div id="ai" class="panel"></div><div id="policy" class="panel"></div><div id="market" class="panel"></div>
<section class="card"><div class="rank">WEEKLY / MARKET MAP</div><h2>今週の市場を5つの視点で統合</h2><div class="chips"><span class="chip">CAPITAL</span><span class="chip">COMPETITOR</span><span class="chip">AI</span><span class="chip">POLICY</span><span class="chip">NEXT SIGNAL</span></div></section>
<p class="footer">LIVE BUILD v1.1. 最新フィードは自動更新し、更新前のフィードは最大90日分をアーカイブします。保存状態は最新記事・過去記事で共通です。</p></main>
<script>
const fallback=[];let currentItems=fallback,archiveDays=[],must=false,savedOnly=false,selected="current";const saved=new Set(JSON.parse(localStorage.getItem("bios_saved_v1")||"[]"));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(x){const sid=x.title||x.url;return `<article class="card"><div class="rank">${esc(x.tier)} / ${esc(x.cat)}</div><h2>${esc(x.title)}</h2><div class="chips"><span class="chip score">IMPACT ${esc(x.score)}/100</span><span class="chip">FACT / READ分離</span></div><div class="sec"><b>FACT</b><p>${esc(x.fact)}</p></div><div class="sec"><b>READ</b><p>${esc(x.read)}</p></div><div class="sec"><b>ACTION</b><p>${esc(x.action)}</p></div><div class="sec"><b>SOURCE</b><p>${esc(x.source)}</p><a class="src" target="_blank" rel="noopener" href="${esc(x.url)}">原典を開く ↗</a> <button class="btn save" data-id="${encodeURIComponent(sid)}">${saved.has(sid)?"★ 保存済":"☆ 保存"}</button></div></article>`}
function activeItems(){if(selected==="current")return currentItems;return archiveDays.find(d=>d.date===selected)?.items||[]}
function render(){const items=activeItems();["today","hr","ai","policy","market"].forEach(t=>{let a=items.filter(x=>(x.tabs||[]).includes(t)).filter(x=>!must||x.tier==="MUST READ").filter(x=>!savedOnly||saved.has(x.title||x.url));let intro=t==="market"?`<div class="marketIntro"><b>MARKET DEEP DIVE</b><div class="small">競合・M&A・資金調達・隣接市場・海外動向を重点監視。</div></div>`:"";document.getElementById(t).innerHTML=intro+(a.length?a.map(card).join(""):`<div class="empty">該当記事はありません。</div>`)});document.querySelectorAll(".save").forEach(b=>b.onclick=()=>{const id=decodeURIComponent(b.dataset.id);saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem("bios_saved_v1",JSON.stringify([...saved]));render()})}
async function load(){try{const [fr,ar]=await Promise.all([fetch("./data/feed.json?ts="+Date.now(),{cache:"no-store"}),fetch("./data/archive.json?ts="+Date.now(),{cache:"no-store"})]);const f=await fr.json();if(Array.isArray(f.items))currentItems=f.items;if(ar.ok){const a=await ar.json();archiveDays=Array.isArray(a.days)?a.days:[]}const sel=document.getElementById("archiveSelect");archiveDays.forEach(d=>{const o=document.createElement("option");o.value=d.date;o.textContent=d.date;sel.appendChild(o)});if(f.generated_at)document.getElementById("date").textContent=f.generated_at.slice(0,10).replaceAll("-",".");render()}catch(e){console.log(e);render()}}
document.getElementById("archiveSelect").onchange=e=>{selected=e.target.value;render()};document.getElementById("todayBtn").onclick=()=>{selected="current";document.getElementById("archiveSelect").value="current";render()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.tab).classList.add("on")});document.getElementById("mustBtn").onclick=e=>{must=!must;e.target.classList.toggle("active",must);render()};document.getElementById("savedBtn").onclick=e=>{savedOnly=!savedOnly;e.target.classList.toggle("active",savedOnly);render()};document.getElementById("date").textContent=new Intl.DateTimeFormat("ja-JP",{dateStyle:"medium"}).format(new Date());load();
</script></body></html>
